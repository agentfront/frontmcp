<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="npx frontmcp create my-app, then cd my-app &amp;&amp; npm install and npm run dev: an MCP server running on localhost:3000"><title>Start a FrontMCP server</title><style>@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }</style><defs><clipPath id="readme-card"><rect width="960" height="380" rx="20"/></clipPath></defs><g clip-path="url(#readme-card)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380"><style>
