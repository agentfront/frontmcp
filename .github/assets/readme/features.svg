<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="FrontMCP features">
<title>Why FrontMCP</title>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d141b"/><stop offset="1" stop-color="#080c11"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#07C983" stop-opacity="0"/><stop offset=".5" stop-color="#07C983"/><stop offset="1" stop-color="#07C983" stop-opacity="0"/></linearGradient>
</defs>
<style>
  .k{opacity:0}
  .k0{animation:in .9s 0.00s cubic-bezier(.2,.7,.2,1) both}.k1{animation:in .9s 0.12s cubic-bezier(.2,.7,.2,1) both}.k2{animation:in .9s 0.24s cubic-bezier(.2,.7,.2,1) both}.k3{animation:in .9s 0.36s cubic-bezier(.2,.7,.2,1) both}.k4{animation:in .9s 0.48s cubic-bezier(.2,.7,.2,1) both}.k5{animation:in .9s 0.60s cubic-bezier(.2,.7,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
  .sweep{stroke-dasharray:14 86;animation:run 12.6s linear infinite}
  @keyframes run{to{stroke-dashoffset:-100}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.k{opacity:1}}
</style>
<g transform="translate(20 20)"><g class="k k0">
  <rect width="400" height="148" rx="16" fill="url(#card)" stroke="#1d2833"/>
  <rect class="sweep" style="animation-delay:-0.0s" width="400" height="148" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.6" pathLength="100"/>
  <rect x="26" y="26" width="52" height="40" rx="10" fill="#07C983" fill-opacity=".1" stroke="#07C983" stroke-opacity=".35"/>
  <text x="52" y="52" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#07C983">{ }</text>
  <text x="26" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#f2f5f7">Typed end to end</text>
  <text x="26" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b98a5">Decorators and Zod, checked at compile time.</text>
</g></g><g transform="translate(440 20)"><g class="k k1">
  <rect width="400" height="148" rx="16" fill="url(#card)" stroke="#1d2833"/>
  <rect class="sweep" style="animation-delay:-2.1s" width="400" height="148" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.6" pathLength="100"/>
  <rect x="26" y="26" width="52" height="40" rx="10" fill="#07C983" fill-opacity=".1" stroke="#07C983" stroke-opacity=".35"/>
  <text x="52" y="52" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#07C983">***</text>
  <text x="26" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#f2f5f7">Auth built in</text>
  <text x="26" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b98a5">OAuth, JWKS, DCR and sessions out of the box.</text>
</g></g><g transform="translate(860 20)"><g class="k k2">
  <rect width="400" height="148" rx="16" fill="url(#card)" stroke="#1d2833"/>
  <rect class="sweep" style="animation-delay:-4.2s" width="400" height="148" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.6" pathLength="100"/>
  <rect x="26" y="26" width="52" height="40" rx="10" fill="#07C983" fill-opacity=".1" stroke="#07C983" stroke-opacity=".35"/>
  <text x="52" y="52" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#07C983">-></text>
  <text x="26" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#f2f5f7">Ship anywhere</text>
  <text x="26" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b98a5">Node, Vercel, Lambda and Cloudflare Workers.</text>
</g></g><g transform="translate(20 188)"><g class="k k3">
  <rect width="400" height="148" rx="16" fill="url(#card)" stroke="#1d2833"/>
  <rect class="sweep" style="animation-delay:-6.3s" width="400" height="148" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.6" pathLength="100"/>
  <rect x="26" y="26" width="52" height="40" rx="10" fill="#07C983" fill-opacity=".1" stroke="#07C983" stroke-opacity=".35"/>
  <text x="52" y="52" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#07C983">o-o</text>
  <text x="26" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#f2f5f7">Every stage is a hook</text>
  <text x="26" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b98a5">Wrap or replace any flow stage from a plugin.</text>
</g></g><g transform="translate(440 188)"><g class="k k4">
  <rect width="400" height="148" rx="16" fill="url(#card)" stroke="#1d2833"/>
  <rect class="sweep" style="animation-delay:-8.4s" width="400" height="148" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.6" pathLength="100"/>
  <rect x="26" y="26" width="52" height="40" rx="10" fill="#07C983" fill-opacity=".1" stroke="#07C983" stroke-opacity=".35"/>
  <text x="52" y="52" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#07C983">[ui]</text>
  <text x="26" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#f2f5f7">Tools with a face</text>
  <text x="26" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b98a5">Return React widgets, not just JSON.</text>
</g></g><g transform="translate(860 188)"><g class="k k5">
  <rect width="400" height="148" rx="16" fill="url(#card)" stroke="#1d2833"/>
  <rect class="sweep" style="animation-delay:-10.5s" width="400" height="148" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.6" pathLength="100"/>
  <rect x="26" y="26" width="52" height="40" rx="10" fill="#07C983" fill-opacity=".1" stroke="#07C983" stroke-opacity=".35"/>
  <text x="52" y="52" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#07C983">v.*</text>
  <text x="26" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#f2f5f7">One endpoint, any client</text>
  <text x="26" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8b98a5">Every MCP protocol revision, served together.</text>
</g></g>
</svg>
